name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice   # spice 팩 테스트용
      - run: uv sync --all-groups
      - name: format and lint (ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: seed determinism
        run: |
          uv run harness seed | grep -q "sha256_16: 92d0c19eb4f1cd2a"
          uv run harness seed --pack factory | grep -q "sha256_16: 0fbe098605883ba6"
      - run: uv run pytest -q
      - name: mcp server smoke (enterprise + spice + factory)
        run: |
          uv run python scripts/mcp_check.py
          HARNESS_HYBRID=0 uv run python scripts/mcp_check.py spice
          HARNESS_HYBRID=0 uv run python scripts/mcp_check.py factory
      # 소형 eval 스모크(모델 호출)는 2주차에 API 키 secret 과 함께 추가한다.

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-harness-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
