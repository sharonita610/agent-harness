name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - name: seed determinism
        run: |
          uv run harness seed | grep -q "sha256_16: 92d0c19eb4f1cd2a"
      - name: mcp server smoke (tools list only)
        run: uv run python scripts/mcp_check.py
      # 소형 eval 스모크(모델 호출)는 2주차에 API 키 secret 과 함께 추가한다.
