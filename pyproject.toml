[project]
name = "harness"
version = "0.1.0"
description = "도메인 교체형 에이전트 플랫폼 + 평가 체계. 1차 도메인: 회사 데이터 비서"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "mcp>=1.10",
  "faker>=30",
  "pyyaml>=6",
  "rich>=13",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "pymupdf>=2.0",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "ui", "private"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
  "E501",  # 줄 길이는 포매터가 맞추고, 긴 문자열·주석은 그대로 둔다
  "E731",  # q = lambda ... 같은 짧은 지역 헬퍼는 의도한 스타일
  "E741",  # l 한 글자 변수는 짧은 내포식에서만 쓴다
  "E402",  # conftest·팩 도구는 환경변수를 먼저 두고 import 한다
]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

