[project]
name = "harness"
version = "0.1.0"
description = "도메인 교체형 에이전트 플랫폼 + 평가 체계. 1차 도메인: 회사 데이터 비서"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "mcp>=1.10",
  "faker>=30",
  "pyyaml>=6",
  "rich>=13",
  "typer>=0.12",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
